<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhan Hub</title>
    <meta name="description" content="Farhan Hub — by Tundy Team">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <script type="module">
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
        window.BareMux = BareMux;
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    <style>

    </style>
</head>

<body>
    <!-- Farhan Hub sidebar (UI only — forwards clicks to the existing browser controls) -->
    <aside class="fh-sidebar" aria-label="Farhan Hub">
        <div class="fh-logo" title="Farhan Hub">FH</div>
        <button class="fh-side-btn" data-fh-action="newtab" title="New Tab"><i class="fa-solid fa-house"></i></button>
        <button class="fh-side-btn" data-fh-action="reload" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="fh-side-btn" data-fh-action="devtools" title="DevTools"><i class="fa-solid fa-code"></i></button>
        <div class="fh-side-spacer"></div>
        <button class="fh-side-btn" data-fh-action="settings" title="Proxy Settings"><i class="fa-solid fa-gear"></i></button>
    </aside>
    <script>
        document.querySelector('.fh-sidebar').addEventListener('click', function (e) {
            var btn = e.target.closest('[data-fh-action]');
            if (!btn) return;
            var map = { newtab: '.new-tab', reload: '#reload-btn', devtools: '#devtools-btn', settings: '#wisp-settings-btn' };
            var target = document.querySelector(map[btn.dataset.fhAction]);
            if (target) target.click();
        });
    </script>


    <div id="app"></div>

    <div class="wisp-settings-modal hidden" id="wisp-settings-modal">
        <div class="settings-card">
            <div class="settings-header">
                <h2><i class="fa-solid fa-server"></i> Proxy Settings</h2>
                <button class="close-btn" id="close-wisp-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="settings-content">
                <div class="section-title"><i class="fa-solid fa-cloud"></i> Select Server</div>
                <div class="server-list" id="server-list"></div>
                <div class="section-title"><i class="fa-solid fa-plus-circle"></i> Custom Server</div>
                <div class="custom-input-group">
                    <input type="text" id="custom-wisp-input" placeholder="wss://your-wisp-server.com/wisp/">
                    <button id="save-custom-wisp"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
            <div class="settings-footer">
                Lower ping = faster browsing
            </div>
        </div>
    </div>
</body>

</html>
