<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Farhan Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap">
  <style>
    :root {
      --bg: #03060f;
      --surface: rgba(8, 16, 34, 0.85);
      --surface-hover: rgba(14, 28, 60, 0.95);
      --border: rgba(0, 212, 255, 0.18);
      --border-light: rgba(0, 212, 255, 0.45);
      --text: #e3f6ff;
      --muted: #7a9cc0;
      --dim: #4b6585;
      --accent: #00d4ff;
      --accent-2: #2f7bff;
      --glow: 0 0 6px rgba(0, 212, 255, 0.55), 0 0 18px rgba(0, 150, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(0, 140, 255, 0.16), transparent 55%),
        radial-gradient(rgba(0, 212, 255, 0.07) 1px, transparent 1px) 0 0 / 22px 22px,
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 90px;
    }

    /* Branding */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
      text-align: center;
    }

    .brand-title {
      font-family: 'Orbitron', 'Inter', sans-serif;
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 800;
      letter-spacing: 1px;
      color: #c9f6ff;
      text-shadow:
        0 0 4px #fff,
        0 0 10px var(--accent),
        0 0 24px var(--accent),
        0 0 48px var(--accent-2),
        0 0 80px rgba(47, 123, 255, 0.6);
      animation: flicker 6s infinite;
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.7);
    }

    .subscribe-badge {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: rgba(0, 212, 255, 0.08);
      color: #dff8ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: var(--glow), inset 0 0 8px rgba(0, 212, 255, 0.25);
      animation: pulse 2.4s ease-in-out infinite;
      cursor: default;
      user-select: none;
    }

    .subscribe-badge i { color: var(--accent); text-shadow: 0 0 6px var(--accent); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(0, 212, 255, 0.5), 0 0 14px rgba(0, 150, 255, 0.3); }
      50% { box-shadow: 0 0 10px rgba(0, 212, 255, 0.85), 0 0 28px rgba(0, 150, 255, 0.55); }
    }

    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.75; }
      94% { opacity: 1; }
      96% { opacity: 0.85; }
    }

    /* Search */
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 8px 8px 16px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 28px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.25), 0 0 22px rgba(0, 212, 255, 0.3);
    }

    .search-box > i { color: var(--muted); font-size: 14px; }

    .search-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .search-box input::placeholder { color: var(--dim); }

    .search-box select {
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .search-box select option { background: #070d1c; }

    .search-go {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #02101f;
      cursor: pointer;
      box-shadow: var(--glow);
      transition: transform 0.15s;
    }

    .search-go:hover { transform: scale(1.06); }

    /* Shortcuts */
    .shortcuts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      max-width: 620px;
      width: 100%;
      margin-bottom: 24px;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 60px;
      text-decoration: none;
      cursor: pointer;
    }

    .shortcut-icon {
      width: 50px;
      height: 50px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }

    .shortcut:hover .shortcut-icon {
      background: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: var(--glow);
      transform: translateY(-2px);
    }

    .shortcut-icon img {
      width: 22px;
      height: 22px;
      /* tint monochrome icons cyan */
      filter: brightness(0) saturate(100%) invert(76%) sepia(64%) saturate(2600%) hue-rotate(155deg) brightness(102%) contrast(101%);
      opacity: 0.85;
    }

    .shortcut-icon i { font-size: 18px; color: var(--accent); }

    .shortcut-label {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shortcut:hover .shortcut-label { color: var(--text); }

    /* Info pills */
    .pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 26px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      font-size: 11px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .pill i { color: var(--accent); }
    .pill span { color: var(--dim); }

    /* Clock card */
    .clock-card {
      padding: 22px 34px;
      min-width: 190px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.18), inset 0 0 18px rgba(0, 212, 255, 0.06);
    }

    .clock {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
    }

    .date { margin-top: 4px; font-size: 11px; color: var(--muted); }

    .quote {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--dim);
      max-width: 400px;
      width: calc(100% - 40px);
      text-align: center;
    }

    .loader {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 15, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loader.show { display: flex; }

    .spinner {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(0, 212, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(0, 212, 255, 0.35);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
  </div>

  <header class="brand">
    <h1 class="brand-title">Farhan Hub</h1>
    <div class="brand-sub">Tundy Team</div>
    <span class="subscribe-badge"><i class="fa-solid fa-bell"></i> Subscribe</span>
  </header>

  <form class="search-box" id="searchForm">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search for anything!" autocomplete="off">
    <select id="engine">
      <option value="https://search.brave.com/search?q=">Brave</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.google.com/search?q=">Google</option>
    </select>
    <button type="submit" class="search-go" title="Search"><i class="fa-solid fa-arrow-right"></i></button>
  </form>

  <div class="shortcuts" id="shortcuts">
    <a class="shortcut" data-url="https://youtube.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg">
      </div>
      <span class="shortcut-label">YouTube</span>
    </a>
    <a class="shortcut" data-url="https://github.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg">
      </div>
      <span class="shortcut-label">GitHub</span>
    </a>
    <a class="shortcut" data-url="https://discord.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg">
      </div>
      <span class="shortcut-label">Discord</span>
    </a>
    <a class="shortcut" data-url="https://twitter.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg"></div>
      <span class="shortcut-label">Twitter</span>
    </a>
    <a class="shortcut" data-url="https://reddit.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/reddit.svg">
      </div>
      <span class="shortcut-label">Reddit</span>
    </a>
    <a class="shortcut" data-url="https://spotify.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/spotify.svg">
      </div>
      <span class="shortcut-label">Spotify</span>
    </a>
    <a class="shortcut" data-url="https://netflix.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/netflix.svg">
      </div>
      <span class="shortcut-label">Netflix</span>
    </a>
    <a class="shortcut" data-url="https://twitch.tv">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitch.svg">
      </div>
      <span class="shortcut-label">Twitch</span>
    </a>
    <a class="shortcut" data-url="https://mail.google.com">
      <div class="shortcut-icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"></div>
      <span class="shortcut-label">Gmail</span>
    </a>
    <div class="shortcut" id="addShortcut">
      <div class="shortcut-icon"><i class="fa-solid fa-plus"></i></div>
      <span class="shortcut-label">Add</span>
    </div>
  </div>

  <div class="pills">
    <div class="pill"><i class="fa-solid fa-bolt"></i> Farhan Hub <span>by Tundy Team</span></div>
    <div class="pill"><i class="fa-solid fa-shield-halved"></i> Private browsing <span>powered by Wisp</span></div>
  </div>

  <div class="clock-card">
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date"></div>
  </div>

  <div class="quote" id="quote"></div>

  <script>
    const $ = s => document.querySelector(s);
    const nav = url => {
      $('#loader').classList.add('show');
      window.parent?.postMessage({ type: 'navigate', url }, '*');
    };

    // Clock
    function updateClock() {
      const now = new Date();
      $('#clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
      $('#date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Search
    $('#searchForm').onsubmit = e => {
      e.preventDefault();
      const q = $('#searchInput').value.trim();
      if (q) nav($('#engine').value + encodeURIComponent(q));
    };

    // Shortcuts
    $('#shortcuts').onclick = e => {
      const shortcut = e.target.closest('.shortcut[data-url]');
      const addBtn = e.target.closest('#addShortcut');

      if (shortcut) {
        e.preventDefault();
        nav(shortcut.dataset.url);
      } else if (addBtn) {
        const name = prompt("Shortcut name:");
        if (!name) return;
        let url = prompt("URL:");
        if (!url) return;
        if (!url.startsWith('http')) url = 'https://' + url;

        const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
        shortcuts.push({ name, url });
        localStorage.setItem('shortcuts', JSON.stringify(shortcuts));
        renderCustom();
      }
    };

    function renderCustom() {
      document.querySelectorAll('.custom-shortcut').forEach(e => e.remove());
      const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
      const addBtn = $('#addShortcut');

      shortcuts.forEach(s => {
        const div = document.createElement('div');
        div.className = 'shortcut custom-shortcut';
        div.dataset.url = s.url;
        div.innerHTML = `
          <div class="shortcut-icon"><i class="fa-solid fa-link"></i></div>
          <span class="shortcut-label">${s.name}</span>
        `;
        addBtn.before(div);
      });
    }

    // Quote
    const quotes = [
    "so tuff",
    "it is what it is",
    "do ur work",
    "this is what happens when u dont touch grass",
    "FULL BOX",
    "FULL PIECE",
    "200!",
    "press esc + refresh + power button for hacks",
    "press ctrl+x to hide your screen",
    "change the tab title and favicon in settings",
    "TEACHERR!",
    "lebron lebron lebronn james",
    "lebron is OUR goat"
];
    $('#quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

    renderCustom();
  </script>
</body>

</html>
